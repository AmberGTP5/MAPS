### SFT预训练配置（可选但推荐）
### 在mDPO之前先进行SFT warm-up

### 模型配置
model_name_or_path: ./models/Qwen2.5-7B-Instruct
trust_remote_code: true
flash_attn: fa2

### 训练方法
stage: sft
do_train: true
finetuning_type: lora

### LoRA配置
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### 数据集配置（只使用chosen样本）
dataset_dir: ./data/pvr_mdpo_optimized
dataset: pvr_mdpo_train_optimized
eval_dataset: pvr_mdpo_val_optimized
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16

### 输出配置
output_dir: ./saves/qwen25_7b/lora/pvr_sft_optimized
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### 训练超参数
per_device_train_batch_size: 2
gradient_accumulation_steps: 4    # 有效batch size = 8
learning_rate: 1.0e-5             # SFT使用稍大的学习率
num_train_epochs: 2.0             # SFT只需要2个epoch
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000

### 评估配置
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50
save_total_limit: 2

### 优化器配置
optim: adamw_torch
weight_decay: 0.01

### 日志配置
logging_first_step: true
save_only_model: false
