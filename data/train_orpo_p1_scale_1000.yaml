### model
model_name_or_path: ./models/Qwen2.5-7B-Instruct
trust_remote_code: true
flash_attn: fa2

### method
stage: dpo
do_train: true
finetuning_type: lora
pref_loss: orpo
pref_beta: 0.1

### initialize from SFT (same start point for fairness)
adapter_name_or_path: ./saves/qwen25_7b/lora/p1_scale_1000_sft

### dataset (hard-only preference rows)
dataset_dir: ./data/pvr_p1_scale_1000/dpo
dataset: p1_scale_1000_dpo_train
eval_dataset: p1_scale_1000_dpo_val
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ./saves/qwen25_7b/lora/p1_scale_1000_orpo
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
save_total_limit: 2

### optimizer
optim: adamw_torch
weight_decay: 0.01
