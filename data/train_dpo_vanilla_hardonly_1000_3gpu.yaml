### model
model_name_or_path: /root/autodl-tmp/models/Qwen2.5-7B-Instruct
trust_remote_code: true
flash_attn: fa2

### method
stage: dpo
do_train: true
finetuning_type: lora
pref_loss: sigmoid
pref_beta: 0.1

### initialize from SFT
adapter_name_or_path: ./saves/qwen25_7b/lora/hardonly_1000_sft
ref_model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct
ref_model_adapters: ./saves/qwen25_7b/lora/hardonly_1000_sft

### dataset
dataset_dir: ./data/pvr_hardonly_1000/dpo
dataset: pvr_hardonly_1000_dpo_train
eval_dataset: pvr_hardonly_1000_dpo_val
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ./saves/qwen25_7b/lora/hardonly_1000_dpo_vanilla
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
logging_first_step: true
save_only_model: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
ddp_backend: gloo

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
save_total_limit: 1

### optimizer
optim: adamw_torch
weight_decay: 0.01
